
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Translate AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
    min-height: 100vh;
    padding: 20px;
    color: #1e293b;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.1);
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 45px;
    margin-bottom: 10px;
}

h1 {
    color: #4f46e5;
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    color: #64748b;
    line-height: 1.6;
}

.language-row {
    display: grid;
    grid-template-columns: 1fr 55px 1fr;
    gap: 12px;
    align-items: end;
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
    font-size: 15px;
}

.swap-btn {
    height: 45px;
    border: none;
    border-radius: 10px;
    background: #eef2ff;
    color: #4f46e5;
    font-size: 23px;
    cursor: pointer;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    font-size: 16px;
    resize: vertical;
    outline: none;
    line-height: 1.6;
}

textarea:focus, select:focus {
    border-color: #6366f1;
}

.char-count {
    text-align: right;
    color: #64748b;
    font-size: 13px;
    margin-top: 7px;
    margin-bottom: 20px;
}

.translate-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    color: white;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.translate-btn:hover {
    opacity: 0.92;
}

.translate-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.result-box {
    margin-top: 25px;
}

.result-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.result-heading h2 {
    font-size: 19px;
}

.actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    border: none;
    padding: 9px 12px;
    border-radius: 8px;
    background: #eef2ff;
    color: #4338ca;
    cursor: pointer;
}

#output {
    background: #f8fafc;
    overflow-wrap: anywhere;
}

#status {
    margin-top: 12px;
    color: #475569;
    text-align: center;
    font-size: 14px;
}

footer {
    text-align: center;
    margin-top: 25px;
    font-size: 13px;
    color: #64748b;
    line-height: 1.6;
}

@media(max-width: 600px) {
    body {
        padding: 10px;
    }

    .container {
        margin: 10px auto;
        padding: 20px 15px;
        border-radius: 18px;
    }

    h1 {
        font-size: 27px;
    }

    .language-row {
        grid-template-columns: 1fr 42px 1fr;
        gap: 7px;
    }

    select {
        padding: 10px 5px;
        font-size: 13px;
    }

    textarea {
        min-height: 150px;
        font-size: 15px;
    }

    .small-btn {
        padding: 8px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">🌐</div>
        <h1>Smart Translate AI</h1>
        <p>Break language barriers with smart translation.</p>
    </header>

    <div class="language-row">

        <div>
            <label for="sourceLang">Translate From</label>
            <select id="sourceLang">
                <option value="auto">Auto Detect</option>
                <option value="en">English</option>
                <option value="hi" selected>Hindi</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
            </select>
        </div>

        <button class="swap-btn" id="swapBtn"
                title="Swap languages" aria-label="Swap languages">
            ⇄
        </button>

        <div>
            <label for="targetLang">Translate To</label>
            <select id="targetLang">
                <option value="en" selected>English</option>
                <option value="hi">Hindi</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
            </select>
        </div>

    </div>

    <label for="inputText">Enter Your Text</label>

    <textarea id="inputText"
        maxlength="5000"
        placeholder="यहाँ अपना टेक्स्ट लिखें..."></textarea>

    <div class="char-count">
        <span id="charCount">0</span>/5000 characters
    </div>

    <button class="translate-btn" id="translateBtn">
        ✨ Translate Now
    </button>

    <div class="result-box">

        <div class="result-heading">
            <h2>Translation Result</h2>

            <div class="actions">
                <button class="small-btn" id="copyBtn">
                    📋 Copy
                </button>

                <button class="small-btn" id="speakBtn">
                    🔊 Listen
                </button>
            </div>
        </div>

        <textarea id="output"
            placeholder="Your translation will appear here..."
            readonly></textarea>

        <div id="status" role="status" aria-live="polite"></div>

    </div>

    <footer>
        <p>Made with ❤️ using Smart Translate AI</p>
        <p>Translation service requires an internet connection.</p>
    </footer>

</div>

<script>
const inputText = document.getElementById("inputText");
const output = document.getElementById("output");
const sourceLang = document.getElementById("sourceLang");
const targetLang = document.getElementById("targetLang");
const translateBtn = document.getElementById("translateBtn");
const statusBox = document.getElementById("status");

const languageNames = {
    en: "English",
    hi: "Hindi",
    mr: "Marathi",
    gu: "Gujarati",
    bn: "Bengali",
    ta: "Tamil",
    te: "Telugu",
    fr: "French",
    es: "Spanish",
    de: "German",
    ja: "Japanese",
    zh: "Chinese",
    ar: "Arabic",
    ru: "Russian"
};

inputText.addEventListener("input", () => {
    document.getElementById("charCount").textContent =
        inputText.value.length;
});

document.getElementById("swapBtn").addEventListener("click", () => {
    if (sourceLang.value === "auto") {
        statusBox.textContent =
            "Choose a source language before swapping.";
        return;
    }

    const previousSource = sourceLang.value;

    sourceLang.value = targetLang.value;
    targetLang.value = previousSource;

    if (output.value) {
        inputText.value = output.value;
        output.value = "";
        document.getElementById("charCount").textContent =
            inputText.value.length;
    }

    statusBox.textContent = "";
});

translateBtn.addEventListener("click", async () => {
    const text = inputText.value.trim();

    if (!text) {
        statusBox.textContent = "Please enter some text first.";
        inputText.focus();
        return;
    }

    if (sourceLang.value === targetLang.value) {
        statusBox.textContent =
            "Please choose two different languages.";
        return;
    }

    translateBtn.disabled = true;
    translateBtn.textContent = "⏳ Translating...";
    statusBox.textContent = "Connecting to translation service...";
    output.value = "";

    try {
        const params = new URLSearchParams({
            client: "gtx",
            sl: sourceLang.value,
            tl: targetLang.value,
            dt: "t",
            q: text
        });

        const response = await fetch(
            "https://translate.googleapis.com/translate_a/single?" +
            params.toString()
        );

        if (!response.ok) {
            throw new Error("Translation service unavailable.");
        }

        const data = await response.json();

        if (!Array.isArray(data) || !Array.isArray(data[0])) {
            throw new Error("Invalid translation response.");
        }

        const translatedText = data[0]
            .map(part => part && part[0] ? part[0] : "")
            .join("");

        if (!translatedText) {
            throw new Error("No translation was returned.");
        }

        output.value = translatedText;
        statusBox.textContent = "✅ Translation completed!";

    } catch (error) {
        statusBox.textContent =
            "Translation failed. Check your internet connection " +
            "or try again later. This public endpoint may be unavailable.";
    } finally {
        translateBtn.disabled = false;
        translateBtn.textContent = "✨ Translate Now";
    }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!output.value) {
        statusBox.textContent = "Nothing to copy yet.";
        return;
    }

    try {
        await navigator.clipboard.writeText(output.value);
        statusBox.textContent = "✅ Translation copied!";
    } catch {
        output.focus();
        output.select();

        const copied = document.execCommand("copy");

        statusBox.textContent = copied
            ? "✅ Translation copied!"
            : "Please select and copy the text manually.";
    }
});

document.getElementById("speakBtn").addEventListener("click", () => {
    if (!output.value) {
        statusBox.textContent = "Translate some text first.";
        return;
    }

    if (!("speechSynthesis" in window)) {
        statusBox.textContent =
            "Speech playback is not supported by this browser.";
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(output.value);

    const languageCodes = {
        en: "en-US",
        hi: "hi-IN",
        mr: "mr-IN",
        gu: "gu-IN",
        bn: "bn-IN",
        ta: "ta-IN",
        te: "te-IN",
        fr: "fr-FR",
        es: "es-ES",
        de: "de-DE",
        ja: "ja-JP",
        zh: "zh-CN",
        ar: "ar-SA",
        ru: "ru-RU"
    };

    speech.lang = languageCodes[targetLang.value] || "en-US";

    window.speechSynthesis.speak(speech);
    statusBox.textContent = "🔊 Playing translation...";
});

</script>

</body>
  </html>
